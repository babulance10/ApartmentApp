server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The app uses hash-based routing (#/...), so every path simply serves
    # the same index.html - no SPA history-mode rewrite rules needed.
    # index.html itself must never be cached: it references the hashed
    # asset filenames, so a stale cached copy keeps loading old JS/CSS
    # (and, after an infra change like a domain/backend swap, can keep
    # pointing at the wrong API indefinitely).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
